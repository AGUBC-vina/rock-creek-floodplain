<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Cross section B-B taken mid-pool between two rock weirs showing the backwater pool, channel, floodplain benches, and planting zones">

  <!-- ====== Header ====== -->
  <rect width="1000" height="460" fill="#f7f5f0"/>
  <text x="500" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a33">Section B&#x2013;B &#x2014; mid-pool between two weirs (100 ft upstream of next weir)</text>
  <text x="500" y="40" text-anchor="middle" font-size="11" fill="#4a5a66">Looking downstream. Vertical scale exaggerated ~8&#xD7;. Datum = channel bed (0.0 ft).</text>

  <!-- ====== Patterns ====== -->
  <defs>
    <pattern id="subsurface-b" patternUnits="userSpaceOnUse" width="14" height="10">
      <rect width="14" height="10" fill="#d9c9a6"/>
      <line x1="0" y1="5" x2="14" y2="5" stroke="#b8a370" stroke-width="0.4"/>
      <line x1="7" y1="0" x2="7" y2="10" stroke="#b8a370" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="hardpan-b" patternUnits="userSpaceOnUse" width="10" height="6">
      <rect width="10" height="6" fill="#9a8866"/>
      <line x1="0" y1="3" x2="10" y2="3" stroke="#6b5d52" stroke-width="0.8"/>
    </pattern>
    <pattern id="saturated-soil" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#9bb29a"/>
      <circle cx="5" cy="5" r="0.7" fill="#5a7a3a"/>
    </pattern>
  </defs>

  <!-- ====== Sky / above-ground ====== -->
  <rect x="0" y="50" width="1000" height="250" fill="#f1ece0" opacity="0.4"/>

  <!-- ====== Subsurface ====== -->
  <path d="M 0 300 L 40 290 L 200 285 L 440 285 L 440 300 L 560 300 L 560 285 L 800 285 L 960 290 L 1000 300 L 1000 420 L 0 420 Z"
        fill="url(#subsurface-b)" stroke="#a08f5e" stroke-width="0.8"/>

  <!-- Saturated soils in the wetland fringe (because of frequent inundation in pool) -->
  <rect x="320" y="282" width="120" height="14" fill="url(#saturated-soil)" opacity="0.7"/>
  <rect x="560" y="282" width="120" height="14" fill="url(#saturated-soil)" opacity="0.7"/>

  <!-- Shallow hardpan / duripan layer -->
  <rect x="0" y="380" width="1000" height="14" fill="url(#hardpan-b)" opacity="0.85"/>
  <text x="990" y="404" text-anchor="end" font-size="9" font-style="italic" fill="#3a3128">
    Shallow restrictive layer (per RCRD Infil. Study) &#x2014; depth varies; presence reach-specific
  </text>

  <!-- ====== Surface profile (no weir at this station) ====== -->
  <path d="M 0 290 L 40 285 L 200 280 L 360 282 L 440 285 L 440 300 L 560 300 L 560 285 L 640 282 L 800 280 L 960 285 L 1000 290"
        fill="none" stroke="#4a3d2e" stroke-width="2.5"/>

  <!-- ====== Water surfaces ====== -->
  <!-- Backwater pool (sustained low-flow ponding from downstream weir): WS ~el 2.3 ft (y=231) -->
  <!-- Water fills the channel and extends up onto the wetland fringe slightly -->
  <path d="M 360 282 L 440 285 L 440 300 L 560 300 L 560 285 L 640 282 L 640 231 L 360 231 Z"
        fill="#7fb1c8" opacity="0.7"/>
  <line x1="360" y1="231" x2="640" y2="231" stroke="#2c5f73" stroke-width="2"/>
  <text x="500" y="220" text-anchor="middle" font-size="10" font-weight="600" fill="#2c5f73">
    Low-flow backwater pool, WS &#x2248; 2.3 ft (sustained from downstream weir)
  </text>

  <!-- Design event WS: ~el 3.7 ft (y=189) — slightly higher than at-weir section due to backwater rise -->
  <line x1="60" y1="189" x2="940" y2="189" stroke="#2c5f73" stroke-width="2" stroke-dasharray="6 3"/>
  <path d="M 60 189 L 940 189 L 940 285 L 800 280 L 640 282 L 560 285 L 560 300 L 440 300 L 440 285 L 360 282 L 200 280 L 40 285 L 60 189 Z"
        fill="#7fb1c8" opacity="0.35"/>
  <text x="500" y="184" text-anchor="middle" font-size="10" font-weight="600" fill="#2c5f73">
    Design event WS &#x2248; 3.7 ft (slightly above the at-weir section &#x2014; backwater profile)
  </text>

  <!-- ====== Planting zone labels (along bottom) ====== -->
  <g font-size="10" fill="#1f2a33" font-weight="600">
    <text x="20" y="440" text-anchor="start">Terrace</text>
    <text x="120" y="440" text-anchor="middle">Grassland</text>
    <text x="280" y="440" text-anchor="middle">Riparian</text>
    <text x="400" y="440" text-anchor="middle">Wet meadow*</text>
    <text x="500" y="440" text-anchor="middle">Channel + pool</text>
    <text x="600" y="440" text-anchor="middle">Wet meadow*</text>
    <text x="720" y="440" text-anchor="middle">Riparian</text>
    <text x="880" y="440" text-anchor="middle">Grassland</text>
    <text x="980" y="440" text-anchor="end">Terrace</text>
  </g>
  <text x="500" y="455" text-anchor="middle" font-size="9" font-style="italic" fill="#4a5a66">
    *Wet-meadow band wider here than at the weir section because the backwater pool sustains soil saturation through the wet season
  </text>

  <!-- Planting zone dividers -->
  <g stroke="#7a8894" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6">
    <line x1="40" y1="285" x2="40" y2="425"/>
    <line x1="200" y1="280" x2="200" y2="425"/>
    <line x1="360" y1="282" x2="360" y2="425"/>
    <line x1="440" y1="300" x2="440" y2="425"/>
    <line x1="560" y1="300" x2="560" y2="425"/>
    <line x1="640" y1="282" x2="640" y2="425"/>
    <line x1="800" y1="280" x2="800" y2="425"/>
    <line x1="960" y1="285" x2="960" y2="425"/>
  </g>

  <!-- ====== Vegetation icons ====== -->
  <!-- Grassland (small clumps) -->
  <g fill="#5a7a3a" opacity="0.8">
    <path d="M 100 280 q -2 -8 -1 -12 q 2 -3 4 0 q 1 4 -1 12 Z"/>
    <path d="M 140 280 q -2 -8 -1 -12 q 2 -3 4 0 q 1 4 -1 12 Z"/>
    <path d="M 180 280 q -2 -8 -1 -12 q 2 -3 4 0 q 1 4 -1 12 Z"/>
    <path d="M 820 280 q -2 -8 -1 -12 q 2 -3 4 0 q 1 4 -1 12 Z"/>
    <path d="M 860 280 q -2 -8 -1 -12 q 2 -3 4 0 q 1 4 -1 12 Z"/>
    <path d="M 900 280 q -2 -8 -1 -12 q 2 -3 4 0 q 1 4 -1 12 Z"/>
  </g>

  <!-- Riparian (small trees including willow / cottonwood / elderberry placeholder) -->
  <g>
    <line x1="240" y1="280" x2="240" y2="252" stroke="#5a4a3a" stroke-width="1.5"/>
    <circle cx="240" cy="245" r="11" fill="#3f6b3a" opacity="0.85"/>
    <line x1="290" y1="282" x2="290" y2="248" stroke="#5a4a3a" stroke-width="1.5"/>
    <circle cx="290" cy="240" r="13" fill="#3f6b3a" opacity="0.85"/>
    <line x1="320" y1="282" x2="320" y2="252" stroke="#5a4a3a" stroke-width="1.5"/>
    <circle cx="320" cy="246" r="10" fill="#4f7a4a" opacity="0.85"/>
    <line x1="680" y1="282" x2="680" y2="252" stroke="#5a4a3a" stroke-width="1.5"/>
    <circle cx="680" cy="246" r="10" fill="#4f7a4a" opacity="0.85"/>
    <line x1="710" y1="282" x2="710" y2="248" stroke="#5a4a3a" stroke-width="1.5"/>
    <circle cx="710" cy="240" r="13" fill="#3f6b3a" opacity="0.85"/>
    <line x1="760" y1="280" x2="760" y2="252" stroke="#5a4a3a" stroke-width="1.5"/>
    <circle cx="760" cy="246" r="11" fill="#3f6b3a" opacity="0.85"/>
  </g>

  <!-- Wet meadow vegetation (sedges, rushes) more extensive than at-weir section -->
  <g stroke="#5a7a3a" stroke-width="1.2" stroke-linecap="round" fill="none">
    <path d="M 360 282 v -8 M 365 282 v -10 M 370 282 v -7 M 375 282 v -11
              M 380 282 v -9 M 385 282 v -12 M 390 282 v -8 M 395 282 v -10
              M 400 282 v -11 M 405 282 v -9 M 410 282 v -12 M 415 282 v -8
              M 420 282 v -10 M 425 282 v -11 M 430 282 v -9 M 435 282 v -8"/>
    <path d="M 565 282 v -8 M 570 282 v -10 M 575 282 v -7 M 580 282 v -11
              M 585 282 v -9 M 590 282 v -12 M 595 282 v -8 M 600 282 v -10
              M 605 282 v -11 M 610 282 v -9 M 615 282 v -12 M 620 282 v -8
              M 625 282 v -10 M 630 282 v -11 M 635 282 v -9"/>
  </g>

  <!-- Emergent / aquatic vegetation at edges of pool -->
  <g stroke="#5a7a3a" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 440 285 v -22 M 445 285 v -28 M 450 285 v -20 M 455 285 v -30 M 460 285 v -18"/>
    <path d="M 540 285 v -22 M 545 285 v -28 M 550 285 v -20 M 555 285 v -30 M 560 285 v -18"/>
  </g>

  <!-- ====== Channel / pool annotation ====== -->
  <g stroke="#1f2a33" stroke-width="1" fill="none">
    <line x1="440" y1="320" x2="560" y2="320"/>
    <line x1="440" y1="316" x2="440" y2="324"/>
    <line x1="560" y1="316" x2="560" y2="324"/>
  </g>
  <text x="500" y="332" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2a33">~30 ft channel (continuous backwater pool)</text>

  <!-- Pool depth callout -->
  <g stroke="#2c5f73" stroke-width="1" fill="none">
    <line x1="585" y1="231" x2="585" y2="300"/>
    <line x1="582" y1="231" x2="588" y2="231"/>
    <line x1="582" y1="300" x2="588" y2="300"/>
  </g>
  <text x="595" y="268" font-size="10" font-weight="600" fill="#2c5f73">~2.3 ft pool depth</text>

  <!-- Total corridor width -->
  <g stroke="#1f2a33" stroke-width="1" fill="none">
    <line x1="40" y1="60" x2="960" y2="60"/>
    <line x1="40" y1="56" x2="40" y2="64"/>
    <line x1="960" y1="56" x2="960" y2="64"/>
  </g>
  <text x="500" y="74" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2a33">~240 ft active corridor (within ~250 ft easement)</text>

  <!-- Setback fence indicators -->
  <g stroke="#7a8894" stroke-width="1" stroke-dasharray="2 2">
    <line x1="20" y1="290" x2="20" y2="270"/>
    <line x1="980" y1="290" x2="980" y2="270"/>
  </g>
  <text x="20" y="265" text-anchor="middle" font-size="9" font-style="italic" fill="#7a8894">setback fence</text>
  <text x="980" y="265" text-anchor="middle" font-size="9" font-style="italic" fill="#7a8894">setback fence</text>

  <!-- Datum -->
  <line x1="0" y1="300" x2="20" y2="300" stroke="#1f2a33" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="5" y="313" font-size="9" font-style="italic" fill="#1f2a33">0.0 ft (bed)</text>

  <!-- Scale bar -->
  <g transform="translate(60 95)">
    <rect x="0" y="0" width="100" height="5" fill="#1f2a33"/>
    <rect x="0" y="0" width="50" height="5" fill="#fff" stroke="#1f2a33" stroke-width="0.4"/>
    <text x="0" y="-3" font-size="9" fill="#1f2a33">0</text>
    <text x="100" y="-3" text-anchor="end" font-size="9" fill="#1f2a33">25 ft (horiz)</text>
  </g>
  <g transform="translate(60 110)">
    <rect x="0" y="0" width="60" height="5" fill="#1f2a33"/>
    <rect x="0" y="0" width="30" height="5" fill="#fff" stroke="#1f2a33" stroke-width="0.4"/>
    <text x="0" y="-3" font-size="9" fill="#1f2a33">0</text>
    <text x="60" y="-3" text-anchor="end" font-size="9" fill="#1f2a33">2 ft (vert)</text>
  </g>

</svg>
