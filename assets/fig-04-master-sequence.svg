<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Gantt-style timeline of the Rock Creek project roadmap's six phases across 60 months, with the major-landowner go/no-go gate marked in Phase 2">

  <!-- Background -->
  <rect width="760" height="360" fill="#ffffff"/>

  <!-- Title -->
  <text x="0" y="16" font-size="14" font-weight="700" fill="#1f2a33">Master Sequence &#x2014; six-phase roadmap</text>

  <!-- ====== Plot area: x 240 (month 0) to 740 (month 60); y 50 to 316 ====== -->

  <!-- Vertical gridlines every 6 months -->
  <g stroke="#e2dccf" stroke-width="1">
    <line x1="240" y1="50" x2="240" y2="316"/>
    <line x1="290" y1="50" x2="290" y2="316"/>
    <line x1="340" y1="50" x2="340" y2="316"/>
    <line x1="390" y1="50" x2="390" y2="316"/>
    <line x1="440" y1="50" x2="440" y2="316"/>
    <line x1="490" y1="50" x2="490" y2="316"/>
    <line x1="540" y1="50" x2="540" y2="316"/>
    <line x1="590" y1="50" x2="590" y2="316"/>
    <line x1="640" y1="50" x2="640" y2="316"/>
    <line x1="690" y1="50" x2="690" y2="316"/>
    <line x1="740" y1="50" x2="740" y2="316"/>
  </g>

  <!-- X-axis baseline -->
  <line x1="240" y1="316" x2="740" y2="316" stroke="#7a8894" stroke-width="1"/>

  <!-- X-axis ticks -->
  <g stroke="#7a8894" stroke-width="1">
    <line x1="240" y1="316" x2="240" y2="320"/>
    <line x1="290" y1="316" x2="290" y2="320"/>
    <line x1="340" y1="316" x2="340" y2="320"/>
    <line x1="390" y1="316" x2="390" y2="320"/>
    <line x1="440" y1="316" x2="440" y2="320"/>
    <line x1="490" y1="316" x2="490" y2="320"/>
    <line x1="540" y1="316" x2="540" y2="320"/>
    <line x1="590" y1="316" x2="590" y2="320"/>
    <line x1="640" y1="316" x2="640" y2="320"/>
    <line x1="690" y1="316" x2="690" y2="320"/>
    <line x1="740" y1="316" x2="740" y2="320"/>
  </g>

  <!-- X-axis tick labels -->
  <g font-size="13" fill="#7a8894" text-anchor="middle">
    <text x="240" y="333">0</text>
    <text x="290" y="333">6</text>
    <text x="340" y="333">12</text>
    <text x="390" y="333">18</text>
    <text x="440" y="333">24</text>
    <text x="490" y="333">30</text>
    <text x="540" y="333">36</text>
    <text x="590" y="333">42</text>
    <text x="640" y="333">48</text>
    <text x="690" y="333">54</text>
    <text x="740" y="333">60</text>
  </g>

  <!-- Axis title -->
  <text x="490" y="352" text-anchor="middle" font-size="13" fill="#4a5a66">months</text>

  <!-- ====== Row labels (left column, x 0-230) ====== -->
  <g font-size="13" fill="#1f2a33">
    <text x="0" y="68">0 &#x2014; Concept Synthesis</text>
    <text x="0" y="83">(current)</text>

    <text x="0" y="112">1 &#x2014; Foundational Data &amp;</text>
    <text x="0" y="127">Relationships</text>

    <text x="0" y="149">2 &#x2014; Hydraulic Screening +</text>
    <text x="0" y="164">Subsurface Confirmation</text>

    <text x="0" y="201">3 &#x2014; Regulatory Pathway +</text>
    <text x="0" y="216">Detailed Design</text>

    <text x="0" y="238">4 &#x2014; Phase-1 Construction</text>
    <text x="0" y="253">(north corridor pilot)</text>

    <text x="0" y="290">5 &#x2014; Long-term</text>
    <text x="0" y="305">Stewardship</text>
  </g>

  <!-- ====== Gantt bars ====== -->
  <!-- Row centers: 72.2, 116.5, 160.8, 205.2, 249.5, 293.8 (row height 44.33, bar height 20) -->

  <!-- Phase 0: months 0-3 -> x 240-265 -->
  <rect x="240" y="62.2" width="25" height="20" fill="#2c5f73" opacity="0.85"/>

  <!-- Phase 1: months 3-9 -> x 265-315 -->
  <rect x="265" y="106.5" width="50" height="20" fill="#2c5f73" opacity="0.85"/>

  <!-- Phase 2: months 6-18 -> x 290-390 -->
  <rect x="290" y="150.8" width="100" height="20" fill="#2c5f73" opacity="0.85"/>

  <!-- Phase 3: months 12-30 -> x 340-490 -->
  <rect x="340" y="195.2" width="150" height="20" fill="#2c5f73" opacity="0.85"/>

  <!-- Phase 4: months 30-48 -> x 490-640 -->
  <rect x="490" y="239.5" width="150" height="20" fill="#2c5f73" opacity="0.85"/>

  <!-- Phase 5: months 48-60(+) -> x 640-705 bar, then a hand-drawn arrowhead (sized to bar height) to x=728, labeled "perpetuity" -->
  <g fill="#2c5f73" opacity="0.85">
    <rect x="640" y="283.8" width="65" height="20"/>
    <path d="M 705 283.8 L 728 293.8 L 705 303.8 Z"/>
  </g>
  <text x="670" y="271" text-anchor="middle" font-size="13" font-weight="600" fill="#2c5f73">perpetuity</text>

  <!-- ====== Go/no-go gate marker: gold diamond on Phase 2 bar at month 12 ====== -->
  <!-- Diamond center at x=340 (month 12), y=160.8 (Phase 2 row center) -->
  <path d="M 340 154.8 L 346 160.8 L 340 166.8 L 334 160.8 Z" fill="#b08d4a" stroke="#1f2a33" stroke-width="1"/>

  <!-- Leader line: from diamond up into the clear gap between Phase 1 and Phase 2 bars -->
  <polyline points="340,154.8 340,140 400,140" fill="none" stroke="#1f2a33" stroke-width="1"/>

  <!-- Gate annotation label, placed in the open gap right of Phase 2's bar end, clear of all bars -->
  <text x="405" y="135" font-size="13" font-weight="700" fill="#1f2a33">major-landowner conversation (L-3) &#x2014;</text>
  <text x="405" y="150" font-size="13" font-weight="700" fill="#1f2a33">project go/no-go gate</text>

</svg>
