<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Horizontal bar chart of central-case capital cost by category for the approximately 30 million dollar Rock Creek concept: A intake and diversion structure 4.5 million dollars; B conveyance to corridor heads 2.5 million dollars; C rock weirs 3.5 million dollars; D plantings and corridor restoration 3.5 million dollars; E engineering, design, and project management 1.5 million dollars; F permitting including CEQA, ESA, CDFW, and FEMA CLOMR 2.0 million dollars; G land control easements 2.0 million dollars; H pre-construction monitoring and establishment 0.7 million dollars; I perpetual operations and maintenance endowment 3.0 million dollars; J contingency 6.5 million dollars, shown in a distinct muted color as an allowance rather than a work item. Total approximately 30 million dollars central case, with a low estimate of approximately 17.5 million dollars and a high estimate of approximately 50 million dollars">

  <!-- Title -->
